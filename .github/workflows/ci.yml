name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workflow
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WORKFLOW_TEST_POSTGRES_DSN: postgresql://workflow:workflow@localhost:5432/workflow
      WORKFLOW_TEST_REDIS_URL: redis://localhost:6379/0
      WORKFLOW_DATABASE_URL: postgresql://workflow:workflow@localhost:5432/workflow
      WORKFLOW_REDIS_URL: redis://localhost:6379/0
      WORKFLOW_API_HOST: 127.0.0.1
      WORKFLOW_ACTIONS_MODULE: workflow_engine.demo_actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_workflow_engine.py' -v && python -m unittest discover -s tests -p 'test_retries.py' -v && python -m unittest discover -s tests -p 'test_api.py' -v && python -m unittest discover -s tests -p 'test_worker_completion_recovery.py' -v
      - name: PostgreSQL 16 integration tests
        run: python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
      - name: Redis integration tests
        run: python -m unittest discover -s tests -p 'test_redis_integration.py' -v
      - name: REST API and discovery integration tests
        run: python -m unittest discover -s tests -p 'test_api_integration.py' -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Benchmark harness smoke against PostgreSQL 16 and Redis 7
        run: |
          token=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "WORKFLOW_API_TOKEN=$token" >> "$GITHUB_ENV"
          export WORKFLOW_API_TOKEN="$token"
          unset token
          python -m workflow_engine api > "$RUNNER_TEMP/wf005-api.log" 2>&1 &
          api_pid=$!
          cleanup() { kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && break; sleep 1; done
          python benchmarks/run.py --smoke --workers 1 --redis --workload linear

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run typecheck
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify loopback Compose demo
        run: scripts/compose-smoke.sh
